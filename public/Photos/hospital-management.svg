<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#082f49"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg6)"/>
  <circle cx="680" cy="150" r="150" fill="#0284c7" filter="blur(90px)" opacity="0.3"/>

  <!-- Architecture Diagram Frame -->
  <rect x="60" y="50" width="680" height="350" rx="16" fill="#0c4a6e" fill-opacity="0.3" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="60" y="50" width="680" height="42" rx="16" fill="#082f49"/>
  <line x1="60" y1="92" x2="740" y2="92" stroke="#0284c7" stroke-width="1"/>

  <circle cx="86" cy="71" r="5" fill="#f43f5e"/>
  <circle cx="102" cy="71" r="5" fill="#f59e0b"/>
  <circle cx="118" cy="71" r="5" fill="#10b981"/>

  <rect x="145" y="60" width="340" height="22" rx="6" fill="#075985"/>
  <text x="160" y="75" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11">hospital-system://clean-architecture/generic-repository</text>

  <rect x="580" y="60" width="135" height="22" rx="6" fill="#0284c7" fill-opacity="0.25"/>
  <text x="595" y="75" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">GENERIC REPOSITORY</text>

  <!-- Clean Architecture Layer Boxes -->
  <!-- Layer 1: Presentation / CLI -->
  <rect x="90" y="115" width="180" height="250" rx="12" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
  <rect x="105" y="130" width="150" height="35" rx="6" fill="#0284c7"/>
  <text x="120" y="152" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Presentation Layer</text>
  <text x="110" y="190" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11">✓ Hospital CLI App</text>
  <text x="110" y="215" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11">✓ Doctor Management</text>
  <text x="110" y="240" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11">✓ Patient Admissions</text>
  <text x="110" y="265" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11">✓ Appointment Sched.</text>
  <text x="110" y="335" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">C# .NET 6 Core</text>

  <!-- Layer 2: Core Domain & Generic Repo Interface -->
  <rect x="310" y="115" width="180" height="250" rx="12" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
  <rect x="325" y="130" width="150" height="35" rx="6" fill="#0369a1"/>
  <text x="340" y="152" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Domain / Contracts</text>
  <text x="330" y="190" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11">✓ IRepository&lt;T&gt;</text>
  <text x="330" y="215" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11">✓ IUnitOfWork</text>
  <text x="330" y="240" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11">✓ Doctor Entity</text>
  <text x="330" y="265" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11">✓ Patient Entity</text>
  <text x="330" y="335" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Clean Architecture</text>

  <!-- Layer 3: Persistence / Data Access -->
  <rect x="530" y="115" width="180" height="250" rx="12" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
  <rect x="545" y="130" width="150" height="35" rx="6" fill="#075985"/>
  <text x="560" y="152" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Persistence Layer</text>
  <text x="550" y="190" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11">✓ GenericRepo&lt;T&gt;</text>
  <text x="550" y="215" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11">✓ In-Memory Store</text>
  <text x="550" y="240" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11">✓ LINQ Expressions</text>
  <text x="550" y="265" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11">✓ CRUD Operations</text>
  <text x="550" y="335" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Decoupled Storage</text>
