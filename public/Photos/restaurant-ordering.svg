<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg8)"/>
  <circle cx="650" cy="150" r="140" fill="#e11d48" filter="blur(90px)" opacity="0.3"/>
  <circle cx="150" cy="350" r="140" fill="#6366f1" filter="blur(90px)" opacity="0.25"/>

  <!-- SQL & System Frame -->
  <rect x="60" y="50" width="680" height="350" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
  <rect x="60" y="50" width="680" height="42" rx="16" fill="#020617"/>
  <line x1="60" y1="92" x2="740" y2="92" stroke="#334155" stroke-width="1"/>

  <circle cx="86" cy="71" r="5" fill="#f43f5e"/>
  <circle cx="102" cy="71" r="5" fill="#f59e0b"/>
  <circle cx="118" cy="71" r="5" fill="#10b981"/>

  <rect x="145" y="60" width="340" height="22" rx="6" fill="#1e293b"/>
  <text x="160" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">ssms://sqlserver.local/SmartRestaurantDB</text>

  <rect x="580" y="60" width="135" height="22" rx="6" fill="#e11d48" fill-opacity="0.2"/>
  <text x="595" y="75" fill="#fda4af" font-family="system-ui, sans-serif" font-size="10" font-weight="700">MS SQL SERVER / 3NF</text>

  <!-- Table Floor Plan & Database Tables Layout -->
  <!-- Left: Floor Table Status -->
  <rect x="90" y="115" width="280" height="250" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="110" y="145" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">🍽️ Dining Floor Table Status</text>
  
  <rect x="110" y="165" width="70" height="55" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981"/>
  <text x="125" y="195" fill="#34d399" font-size="12" font-weight="800">T-01</text>
  <text x="120" y="210" fill="#6ee7b7" font-size="9">Available</text>

  <rect x="195" y="165" width="70" height="55" rx="8" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e"/>
  <text x="210" y="195" fill="#fb7185" font-size="12" font-weight="800">T-02</text>
  <text x="205" y="210" fill="#fda4af" font-size="9">Occupied</text>

  <rect x="280" y="165" width="70" height="55" rx="8" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b"/>
  <text x="295" y="195" fill="#fbbf24" font-size="12" font-weight="800">T-03</text>
  <text x="290" y="210" fill="#fef08a" font-size="9">Reserved</text>

  <rect x="110" y="235" width="240" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="125" y="260" fill="#38bdf8" font-size="11" font-weight="700">Order #804 (T-02):</text>
  <text x="125" y="280" fill="#94a3b8" font-size="10">2x Ribeye Steak Special · $64.00</text>
  <text x="125" y="298" fill="#94a3b8" font-size="10">1x Truffle Parmesan Fries · $12.00</text>
  <text x="125" y="325" fill="#f8fafc" font-size="11" font-weight="800">Total Bill: $76.00 (KOT Sent)</text>

  <!-- Right: SQL Stored Procedure & Trigger Schema -->
  <rect x="390" y="115" width="320" height="250" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="410" y="145" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">⚡ Stored Procedure &amp; Trigger Engine</text>
  
  <g font-family="'Fira Code', Consolas, monospace" font-size="11" line-height="1.5">
    <text x="410" y="180" fill="#f43f5e">CREATE PROCEDURE</text>
    <text x="540" y="180" fill="#38bdf8">sp_ProcessOrder</text>
    <text x="425" y="205" fill="#f43f5e">@TableId</text>
    <text x="485" y="205" fill="#94a3b8">INT,</text>
    <text x="515" y="205" fill="#f43f5e">@CustomerId</text>
    <text x="605" y="205" fill="#94a3b8">INT</text>
    <text x="410" y="230" fill="#f43f5e">AS BEGIN</text>
    <text x="425" y="255" fill="#38bdf8">BEGIN TRANSACTION;</text>
    <text x="425" y="275" fill="#94a3b8">-- Deducts inventory &amp; marks table</text>
    <text x="425" y="295" fill="#34d399">EXEC sp_GenerateKOT @TableId;</text>
    <text x="425" y="315" fill="#38bdf8">COMMIT TRANSACTION;</text>
    <text x="410" y="335" fill="#f43f5e">END;</text>
  </g>
</svg>
